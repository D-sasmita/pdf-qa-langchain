<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" fill="#0e1117"/>

  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="800" fill="url(#titleGrad)">PDF Question Answering — RAG Architecture</text>

  <!-- Section labels -->
  <text x="40" y="100" font-size="15" font-weight="700" fill="#34d399">INDEXING (once per PDF)</text>
  <text x="40" y="330" font-size="15" font-weight="700" fill="#22d3ee">QUERYING (every question)</text>

  <!-- ===== Indexing row ===== -->
  <!-- Box template: x,y,w,h = 40 wide gaps -->
  <g font-size="13.5" fill="#e5e7eb">
    <!-- 1 Upload -->
    <rect x="40" y="120" width="150" height="70" rx="10" fill="#161b22" stroke="#2d333b"/>
    <text x="115" y="150" text-anchor="middle" font-weight="700">📄 PDF Upload(s)</text>
    <text x="115" y="170" text-anchor="middle" fill="#9ca3af" font-size="11.5">Streamlit uploader</text>

    <!-- 2 Load -->
    <rect x="230" y="120" width="150" height="70" rx="10" fill="#161b22" stroke="#2d333b"/>
    <text x="305" y="150" text-anchor="middle" font-weight="700">📂 PyPDFLoader</text>
    <text x="305" y="170" text-anchor="middle" fill="#9ca3af" font-size="11.5">extract text + metadata</text>

    <!-- 3 Split -->
    <rect x="420" y="120" width="150" height="70" rx="10" fill="#161b22" stroke="#2d333b"/>
    <text x="495" y="150" text-anchor="middle" font-weight="700">✂️ Text Splitter</text>
    <text x="495" y="170" text-anchor="middle" fill="#9ca3af" font-size="11.5">1000 chars, 150 overlap</text>

    <!-- 4 Embed -->
    <rect x="610" y="120" width="150" height="70" rx="10" fill="#161b22" stroke="#2d333b"/>
    <text x="685" y="150" text-anchor="middle" font-weight="700">🧠 Embeddings</text>
    <text x="685" y="170" text-anchor="middle" fill="#9ca3af" font-size="11.5">all-MiniLM-L6-v2</text>

    <!-- 5 FAISS -->
    <rect x="800" y="105" width="180" height="100" rx="12" fill="#0f2a24" stroke="#34d399" stroke-width="2"/>
    <text x="890" y="145" text-anchor="middle" font-weight="800" fill="#34d399" font-size="15">🔗 FAISS Index</text>
    <text x="890" y="165" text-anchor="middle" fill="#9ca3af" font-size="11.5">vector store</text>
    <text x="890" y="182" text-anchor="middle" fill="#9ca3af" font-size="11.5">(shared across all PDFs)</text>
  </g>

  <!-- indexing arrows -->
  <line x1="190" y1="155" x2="228" y2="155" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="155" x2="418" y2="155" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="155" x2="608" y2="155" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="155" x2="798" y2="155" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- divider -->
  <line x1="40" y1="230" x2="1160" y2="230" stroke="#2d333b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== Query row ===== -->
  <g font-size="13.5" fill="#e5e7eb">
    <!-- Question -->
    <rect x="40" y="350" width="150" height="70" rx="10" fill="#161b22" stroke="#2d333b"/>
    <text x="115" y="380" text-anchor="middle" font-weight="700">🧑 Question</text>
    <text x="115" y="400" text-anchor="middle" fill="#9ca3af" font-size="11.5">user chat input</text>

    <!-- Retriever -->
    <rect x="230" y="350" width="150" height="70" rx="10" fill="#161b22" stroke="#2d333b"/>
    <text x="305" y="380" text-anchor="middle" font-weight="700">🔎 Retriever</text>
    <text x="305" y="400" text-anchor="middle" fill="#9ca3af" font-size="11.5">top-k similarity search</text>

    <!-- Prompt -->
    <rect x="420" y="350" width="150" height="70" rx="10" fill="#161b22" stroke="#2d333b"/>
    <text x="495" y="380" text-anchor="middle" font-weight="700">📝 Prompt Template</text>
    <text x="495" y="400" text-anchor="middle" fill="#9ca3af" font-size="11.5">context + question</text>

    <!-- LLM -->
    <rect x="610" y="350" width="150" height="70" rx="10" fill="#161b22" stroke="#2d333b"/>
    <text x="685" y="380" text-anchor="middle" font-weight="700">🤖 Groq LLM</text>
    <text x="685" y="400" text-anchor="middle" fill="#9ca3af" font-size="11.5">openai/gpt-oss-20b</text>

    <!-- Answer -->
    <rect x="800" y="335" width="180" height="100" rx="12" fill="#0f2a24" stroke="#22d3ee" stroke-width="2"/>
    <text x="890" y="375" text-anchor="middle" font-weight="800" fill="#22d3ee" font-size="15">✅ Grounded Answer</text>
    <text x="890" y="395" text-anchor="middle" fill="#9ca3af" font-size="11.5">+ source chunks shown</text>
    <text x="890" y="412" text-anchor="middle" fill="#9ca3af" font-size="11.5">"not found" if absent</text>
  </g>

  <!-- query arrows -->
  <line x1="190" y1="385" x2="228" y2="385" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="385" x2="418" y2="385" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="385" x2="608" y2="385" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="385" x2="798" y2="385" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FAISS -> Retriever connector -->
  <path d="M890,205 C890,270 305,270 305,348" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="620" y="262" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">index queried at question time</text>

  <!-- footer note -->
  <text x="600" y="530" text-anchor="middle" fill="#6b7280" font-size="12">Broad/summary questions bypass the retriever and instead sample the first chunks of every loaded document directly.</text>
</svg>
